season_name: "2025_Antarctica_ORCA"
datasets: ["ORCA"]

# Defaults for generating parameter spreadsheet tabs.
# Skeleton mirroring utig/seasons_config/2015_Antarctica_BaslerJKB.yaml — values
# below are placeholders. Fill in once ORCA's radar/system parameters are known.
params:
  cmd:
    frms: ~
    records: 1
    qlook: 1
    sar: ~
    array: ~
    generic: ~
    mission_names: ""
    notes: ""

  records:
    # 425 is the UTIG file.version; ORCA reuses the UTIG ingest schema until OPR
    # adds an ORCA-specific reader.
    file.version: 425
    # v425 defaults to big-endian in data_load.m (UTIG MARFA/HICARS legacy);
    # ORCA's USRP B205mini writes native x86 little-endian fc32, so override
    # here. Without this, every float32 byte-flips and the typecast yields
    # NaN/Inf bit patterns — symptom is qlook Data all zeros after coh-noise
    # subtraction collapses what's left.
    file.endian: "'little'"
    file.boards: "{''}"
    file.start_idx: 1
    file.stop_idx: 1
    file.start_record: ~
    file.stop_record: ~
    file.base_dir: ~              # filled by ORCA define_segments (from user_config.orca_raw_data_base_path)
    file.board_folder_name: ~     # filled by ORCA define_segments (per-segment prefix)
    file.prefix: "_rx_samps.bin"  # appended to file.base_dir/file.board_folder_name; the per-segment prefix lives in file.board_folder_name
    file.clk: ~                   # TODO: ORCA radar clock rate (= GENERATE.sample_rate from _config.yaml)
    frames.geotiff_fn: "antarctica/Landsat-7/Antarctica_LIMA.tif"
    frames.mode: 1
    gps.time_offset: 0
    gps.en: 1
    gps.fn: ~                     # filled by ORCA define_segments

  qlook:
    out_path: ~
    img_comb: "[]"                # single image, no fast-time combining
    imgs: "{[1 1]}"               # one wf-adc pair: (wf=1, adc=1)
    block_size: 20000
    motion_comp: 0
    dec: 10
    inc_dec: 5
    surf.en: 1
    surf.profile: "RDS_OIB"
    resample: "[1 1]"
    radiometric_corr_dB: ~

  radar:
    # Per-segment fields (filled from each recording's _config.yaml by
    # define_segments.py via opr_ingest.orca.radar_config.load_radar_params):
    fs: ~                # RF<n>.rx_rate
    prf: ~               # 1 / CHIRP.pulse_rep_int
    f0: ~                # RF chirp low edge:  RF.freq + RF.lo_offset + GENERATE.lo_offset_sw - chirp_bandwidth/2
    f1: ~                # RF chirp high edge: RF.freq + RF.lo_offset + GENERATE.lo_offset_sw + chirp_bandwidth/2
                         # OPR uses fc=(f0+f1)/2 for lambda=c/fc in SAR
                         # synthetic-aperture math; setting fc=0 (baseband)
                         # gives lambda=Inf -> Inf cluster cpu_time/mem
                         # estimates. f0/f1 stay at RF; DDC_freq below
                         # tells OPR's pulse_compress to shift the
                         # baseband-sampled data into RF-labeled bins.
    Tpd: ~               # GENERATE.chirp_length
    presums: ~           # CHIRP.num_presums
    # Static across all current SORA recordings (B205mini, single-channel):
    adc_bits: 12                          # B205mini ADC width
    Vpp_scale: 1                          # full-scale Vpp; refine when calibrated
    lever_arm_fh: "@lever_arm_ORCA"       # see orca/matlab/lever_arm_ORCA.m (stub returning zeros)
    size: 1                               # 1 board
    # Sample format overrides for v425 (added on thatcher/v425-flexible-
    # sample-format branch of opr). v425's UTIG defaults are int16 real,
    # 4 ADC/board; ORCA writes fc32 complex baseband, single channel.
    # data_load.m reads these via wfs.{complex,sample_type,sample_size,
    # adc_per_board}, used in byte-stride math and the typecast.
    complex: 1                            # I/Q interleaved (fc32)
    sample_type: "'single'"               # float32 typecast
    sample_size: 4                        # bytes per real or imag float
    adc_per_board: 1                      # single RX channel
    deconv.en: 0                          # no waveform deconvolution
    adcs: "[1]"                           # single ADC, index 1
    DDC_dec: 1                            # no software DDC (SDR did it in HW)
    DDC_freq: ~                           # filled per-segment by define_segments.py
                                          # = RF.freq + RF.lo_offset (the SDR's LO).
                                          # Tells OPR what RF carrier was mixed down,
                                          # so freq_pc gets RF labels and the
                                          # pulse_compress mask aligns the
                                          # baseband-sampled chirp with the
                                          # RF-coded BW_window.
    tukey: 0.1
    BW_window: ~                          # left null; OPR should infer from f0/f1
    ft_wind: "@(N)tukeywin(N,0.2)"
    ft_dec: "[1 1]"
    tx_weights: "[1]"
    system_dB: 0
    rx_paths: "[1]"
    adc_gains_dB: "[0]"                   # absolute gains TBD; 0 = no compensation
    chan_equal_dB: "[0]"
    chan_equal_deg: "[0]"
    Tsys: "[0]"
    bit_shifts: "[0]"
    Tadc_adjust: 0
    Tadc: 0
    gain_en: "[0]"
    # 'estimated': qlook estimates coherent noise inline, so the analysis
    # chain (run_analysis -> run_collate_coh_noise) is not required. Switch
    # back to 'analysis' once analysis_noise/analysis sheet defaults exist.
    coh_noise_method: "'estimated'"

  array:
    in_path: ~
    out_path: ~
    img_comb: "[]"
    imgs: "{[1 1]}"
    method: "'standard'"
    bin_rng: "[-1:1]"
    line_rng: "[-10:10]"
    dline: 6
    ft_over_sample: 2
    radiometric_corr_dB: ~

  sar:
    # Ground-survey SAR settings, modeled on CReSIS GroundGHOST 2023/2024
    # (their tracked-vehicle Antarctic radar — closest analog to ORCA's
    # geometry; see opr/matlab/missions/default_radar_params_2023_Antarctica_GroundGHOST_rds.m).
    # sigma_x is the ONLY field sar.m doesn't internally default; everything
    # else falls through unless overridden here.
    imgs: "{[1 1]}"                # ORCA single channel/image
    sigma_x: 1                     # along-track output spacing (m); matches
                                   # GroundGHOST. Tune to actual platform speed.
    chunk_len: 5000
    sar_type: "'fk'"
    surf_filt_dist: 30             # m; replaces sar.m's 3000m airborne default
    # ORCA-specific lever arm; matches radar.lever_arm_fh and the
    # gRadar.cluster.hidden_depend_funs entry on the OPR host.
    lever_arm_fh: "@lever_arm_ORCA"
    # ORCA has no IMU; roll/pitch/heading are zeros, so motion compensation
    # would be a no-op. Disable to avoid surprises.
    mocomp.en: 0
  post:
    # ops.location used by run_all_create_track_files for the output filename
    # `tracks_<location>_<radar>_<season>.mat`.
    ops.location: "'antarctic'"
    # data_dirs is a CELL of folder names post reads Data_*.mat from. Default
    # in post.m is {'qlook'} -> CSARP_qlook (incoherent product). To post the
    # SAR-focused product, point at the array stage's output folder, which
    # matches array.method (currently 'standard' -> CSARP_standard). Sequence
    # to get SAR-focused PDFs: records -> qlook -> sar -> array -> post.
    data_dirs: "{'standard'}"
    # concat_en read by run_post_UTIG line 149 without an isfield default; 0
    # skips the season-level concat step (per-frame/per-segment products are
    # still produced). Set to 1 if you want concatenated season outputs (also
    # forces csv_en=1, since concat reads the CSV files).
    concat_en: 0
    # All post _en flags default to FALSE in post.m, so without explicit values
    # the per-segment loop visits every segment but produces nothing. Flip to 1
    # to enable each product type; left explicit so they're easy to toggle.
    pdf_en: 1        # bundled PDF per frame at <post_path>/pdf/<day_seg>/
    echo_en: 1       # echogram JPG (the radargram page in each PDF)
    layers_en: 0     # layer overlays on the echogram
    # publish_echogram requires echo.elev_comp (no internal default).
    # 0 = no compensation, raw TWTT display (simplest, works without surface).
    # 1 = relative elevation comp (airborne; uses Elevation).
    # 2 = surface-flatten (needs echo.depth and a clean surface layer).
    echo.elev_comp: 0
    # echo.depth is a MATLAB string expression `eval()`'d in publish_echogram
    # to set the y-axis depth range in meters relative to Surface_Depth.
    # Used regardless of elev_comp (line 420 of publish_echogram, in the general
    # else branch). Value below mirrors CReSIS GroundGHOST 2023 rds: 5 m above
    # surface to 1500 m below. Adjust the +1500 to actual target ice thickness
    # if needed (e.g. +3500 for thicker ice).
    # echo.caxis is a NORMALIZED [0,1] percentile pair, NOT absolute dB.
    # publish_echogram (line ~735) sorts the echogram values and picks
    # caxis bounds at these percentiles, so [0.05 0.99] = clip the
    # darkest 5% and brightest 1% — standard radargram contrast.
    echo.caxis: "[0.05 0.99]"
    echo.depth: "'[min(Surface_Depth)-5 max(Surface_Depth)+2000]'"
    maps_en: 0       # segment map JPG; needs basemap GIS data, skipped for now
    csv_en: 0        # per-frame CSV (lat/lon/surface/bottom); data-delivery
    data_en: 0       # bulk data products (.nc/.mat copies); data-delivery
    echo.caxis: "[0.05 0.99]"
  analysis_noise: {}  # TODO
